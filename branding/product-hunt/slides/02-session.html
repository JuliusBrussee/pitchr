<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 2540px; height: 1520px;
      background: #050505;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      position: relative;
    }
    .gradient-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
      width: 100%; height: 100%;
    }
    .headline {
      font-weight: 800;
      line-height: 1.1;
      background: linear-gradient(135deg, #ff5941, #ffaa33);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { color: #9a9a98; line-height: 1.5; }
    .screenshot-frame {
      background: rgba(255,255,255,0.02);
      border: 2px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 60px 160px rgba(255,89,65,0.06), 0 20px 60px rgba(0,0,0,0.4);
      overflow: hidden;
    }
    .screenshot-frame img {
      width: 115%;
      margin-left: -12%;
      border-radius: 16px;
      display: block;
    }
    .tag {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 22px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .tag-coral { background: rgba(255,89,65,0.15); color: #ff5941; }
    .tag-amber { background: rgba(255,170,51,0.15); color: #ffaa33; }
    .tag-green { background: rgba(74,222,128,0.15); color: #4ade80; }
  </style>
</head>
<body>
  <!-- Gradient blobs -->
  <div class="gradient-blob" style="width: 800px; height: 800px; top: -250px; left: -200px; background: rgba(255,170,51,0.18); filter: blur(120px);"></div>
  <div class="gradient-blob" style="width: 600px; height: 600px; bottom: -200px; right: -100px; background: rgba(255,89,65,0.12); filter: blur(100px);"></div>

  <!-- Content -->
  <div class="content">
    <div style="display: flex; align-items: center; gap: 80px; padding: 80px 100px; min-height: 1520px;">

      <!-- Left side: screenshot -->
      <div style="flex: 1; transform: perspective(1600px) rotateY(3deg) rotateX(1deg);">
        <div class="screenshot-frame">
          <img src="../screenshots/session.png" alt="Practice session screenshot">
        </div>
      </div>

      <!-- Right side: copy -->
      <div style="flex: 0 0 38%;">
        <h1 class="headline" style="font-size: 56px; margin-bottom: 24px;">Load your deck.<br>Hit record.<br>Get scored live.</h1>
        <p class="subtitle" style="font-size: 26px; margin-bottom: 32px;">Upload your pitch deck, set your time target, and practice against a real-time rubric. Track every beat of your pitch as you go.</p>

        <!-- Bullets -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
          <div style="display: flex; align-items: center; gap: 16px;">
            <div style="width: 12px; height: 12px; border-radius: 50%; background: #ff5941; flex-shrink: 0;"></div>
            <span style="font-size: 24px; color: #9a9a98;">Live timing &amp; beat tracking</span>
          </div>
          <div style="display: flex; align-items: center; gap: 16px;">
            <div style="width: 12px; height: 12px; border-radius: 50%; background: #ffaa33; flex-shrink: 0;"></div>
            <span style="font-size: 24px; color: #9a9a98;">Deck slide sync</span>
          </div>
          <div style="display: flex; align-items: center; gap: 16px;">
            <div style="width: 12px; height: 12px; border-radius: 50%; background: #4ade80; flex-shrink: 0;"></div>
            <span style="font-size: 24px; color: #9a9a98;">5-dimension rubric preview</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
