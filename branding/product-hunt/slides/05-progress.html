<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 2540px; height: 1520px;
      background: #050505;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      position: relative;
    }
    .gradient-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
      width: 100%; height: 100%;
    }
    .headline {
      font-weight: 800;
      line-height: 1.1;
      background: linear-gradient(135deg, #ff5941, #ffaa33);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { color: #9a9a98; line-height: 1.5; }
    .screenshot-frame {
      background: rgba(255,255,255,0.02);
      border: 2px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 60px 160px rgba(255,89,65,0.06), 0 20px 60px rgba(0,0,0,0.4);
      overflow: hidden;
    }
    .screenshot-frame img {
      width: 115%;
      margin-left: -12%;
      border-radius: 16px;
      display: block;
    }
    .tag {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 22px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .tag-coral { background: rgba(255,89,65,0.15); color: #ff5941; }
    .tag-amber { background: rgba(255,170,51,0.15); color: #ffaa33; }
    .tag-green { background: rgba(74,222,128,0.15); color: #4ade80; }
  </style>
</head>
<body>
  <!-- Coral blob bottom-center -->
  <div class="gradient-blob" style="width: 900px; height: 700px; bottom: -250px; left: 50%; margin-left: -450px; background: rgba(255,89,65,0.2); filter: blur(120px);"></div>
  <!-- Amber blob top-left -->
  <div class="gradient-blob" style="width: 500px; height: 500px; top: -150px; left: -100px; background: rgba(255,170,51,0.1); filter: blur(100px);"></div>

  <div class="content">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 1520px; padding: 60px 80px;">
      <h1 class="headline" style="font-size: 60px; text-align: center; margin-bottom: 24px;">From 57 to 91.<br>In 28 sessions.</h1>
      <p class="subtitle" style="font-size: 26px; text-align: center; max-width: 800px; margin-bottom: 48px;">Watch your score climb session by session. Pitchr tracks your rubric breakdown, streaks, and performance trends over time.</p>
      <div class="screenshot-frame" style="max-width: 1160px; transform: perspective(1600px) rotateX(5deg) rotateY(-1deg);"><img src="../screenshots/dashboard.png" alt="Dashboard"></div>
    </div>
  </div>
</body>
</html>
